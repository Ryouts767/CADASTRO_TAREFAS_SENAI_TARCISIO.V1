<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="cartao-aplicacao">
        <header class="cabecalho-aplicacao">
            <div class="info-cabecalho">
                <img src="oi.jpg" alt="" width="80" height="80">
                <h1>Minhas Tarefas ⚡</h1>
            </div>
            
            <div class="acoes-cabecalho">
                <!-- Contador de Foguinho / Sequência -->
                <div class="foguinho-container" title="Dias seguidos completando tarefas">
                    <i class="fa-solid fa-fire icon-foguinho"></i>
                    <span id="contador-foguinho">0</span>
                </div>
                <button class="botao-icone" id="botao-alternar-tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <div class="caixa-entrada">
            <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?...">
            
            <!-- Seleção de Prioridade -->
            <select id="seletor-prioridade" class="seletor-prioridade">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
            </select>

            <button class="botao-principal" id="botao-adicionar">
                <i class="fa-solid fa-plus"></i>Adicionar
            </button>
        </div>

        <ul class="lista-tarefas" id="lista-tarefas">
        </ul>

        <footer class="rodape-aplicacao">
            <span id="contador-tarefas">0 tarefas na lista</span>
        </footer>
    </div>

    <script src="script.js"></script>

</body>

</html>
